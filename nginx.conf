# 外层若有 HTTPS 反代就沿用它传来的协议，否则用当前请求协议；
# 后端拼接 Linux.do OAuth 回调地址依赖这个头。
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# WebSocket 升级只在客户端确实发了 Upgrade 时才转发。
# 无条件写死 `Connection upgrade` 会让每一个普通接口请求都带上一个升级意图，
# 后端与中间层都得为此额外判一次，出问题时表现为「普通请求偶发 400」，很难联想到反代。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 分享页是「拿到链接即可访问」的私有内容，绝不能被搜索引擎收录。
    # 这是三重 noindex 里的响应头那一层：对代理与非 HTML 资源同样有效，
    # 另外两层是 robots.txt 的 Disallow 与分享页运行时注入的 robots meta。
    location /s/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # 后端接口反代到同容器内的 Node 服务。
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        # 实时协作走 /api/v1/realtime 的 WebSocket，与接口同一个 location，握手头必须原样透传，
        # 否则升级请求会被当成普通 HTTP 转发过去，浏览器侧表现为连上就立刻断开。
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 上传接口需要大 body；SSE 流式响应必须关缓冲，生成任务与流式对话耗时可能很长。
        client_max_body_size 200m;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
